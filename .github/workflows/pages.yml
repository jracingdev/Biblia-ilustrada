name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar os arquivos JSON
        run: |
          for f in $(find data -name '*.json'); do python3 -m json.tool "$f" > /dev/null || { echo "JSON inválido: $f"; exit 1; }; done
      - name: Conferir se os dados batem com o gerador
        run: |
          python3 ferramentas/gerar_dados.py
          git diff --exit-code -- data/estudo/apocalipse-at.json data/estudo/apocalipse-quadros.json

  publicar:
    needs: validar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
